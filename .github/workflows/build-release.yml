name: Build Release

on:
  push:
    branches: [main, master]
    tags:    ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

# Cancel superseded runs on the same branch/tag so a stale build
# doesn't burn runner minutes after a newer push lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: C:\vcpkg
  VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
  VCPKG_TARGET_TRIPLET: x64-windows-static-v143
  VCPKG_PLATFORM_TOOLSET: v143
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"

jobs:
  build:
    # windows-2022 guarantees the v143 toolset that matches the triplet.
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show vcpkg version
        shell: pwsh
        run: |
          Write-Host "VCPKG_ROOT            = $env:VCPKG_ROOT"
          Write-Host "VCPKG_TARGET_TRIPLET  = $env:VCPKG_TARGET_TRIPLET"
          if (-not (Test-Path "$env:VCPKG_ROOT\vcpkg.exe")) {
            throw "vcpkg not found at $env:VCPKG_ROOT"
          }
          & "$env:VCPKG_ROOT\vcpkg.exe" version

      - name: Ensure custom triplet exists
        shell: pwsh
        run: |
          $triplet = "triplets/x64-windows-static-v143.cmake"
          if (-not (Test-Path $triplet)) {
            Write-Host "Creating fallback $triplet"
            New-Item -ItemType Directory -Force -Path "triplets" | Out-Null
            @"
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE static)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_PLATFORM_TOOLSET v143)
          set(VCPKG_BUILD_TYPE release)
          "@ | Set-Content -Encoding ASCII -NoNewline $triplet
          } else {
            Write-Host "Found $triplet (using repo version)"
          }

      # Cache both the configured build tree and the vcpkg binary archives.
      # - build/                 -> CMakeCache.txt + vcpkg_installed + obj files
      # - vcpkg-cache/           -> pre-built package zips (used on cache miss
      #                             so vcpkg doesn't recompile assimp)
      - name: Restore vcpkg packages + build tree
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-cache
            build
          key: mapmaker-v143-v2-${{ hashFiles('vcpkg.json', 'triplets/*.cmake', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            mapmaker-v143-v2-

      # If the cache restored a configured build tree, skip configure.
      # MSBuild auto-reconfigures if CMakeLists.txt is newer than the cache,
      # so this is safe.
      - name: Configure (skip on cache hit)
        shell: pwsh
        run: |
          if (Test-Path "build/CMakeCache.txt") {
            Write-Host "Cache hit: build/CMakeCache.txt exists - skipping configure."
          } else {
            Write-Host "Cache miss: running full configure (this is the slow path)."
            cmake --preset default
          }

      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build --preset release --config Release --parallel

      - name: Verify binary
        shell: pwsh
        run: |
          $exe = "bin/Release/MapMaker.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem -Recurse -Filter MapMaker.exe | ForEach-Object { Write-Host $_ }
            throw "Expected build output not found: $exe"
          }
          Get-Item $exe | Format-List Name, Length, FullName

      - name: Package distribution
        shell: pwsh
        run: |
          $dist = "dist/MapMaker"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Copy-Item "bin/Release/MapMaker.exe" "$dist/MapMaker.exe"
          Copy-Item -Recurse "config" "$dist/config"

          foreach ($f in @("Assets", "Texture", "Material", "Save")) {
            New-Item -ItemType Directory -Force -Path "$dist/$f" | Out-Null
          }
          if (Test-Path "README.md") {
            Copy-Item "README.md" "$dist/README.md"
          }

          Compress-Archive -Path "$dist/*" -DestinationPath "dist/MapMaker-win64.zip" -Force
          Get-ChildItem "dist" | Format-Table Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapMaker-win64
          path: dist/MapMaker-win64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MapMaker-win64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true